---
# Established weekday abbreviations not included in CLDR.
weekday:
  pl:
    # CLDR provides "pon." for Polish Monday. "pn" is also an established
    # Polish calendar abbreviation, but conflicts with Lithuanian "pn" = Friday.
    pn: Mo
