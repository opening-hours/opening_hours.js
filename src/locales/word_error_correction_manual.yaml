regex:
  please use English written ok for ko:
    "(?:an )?feiertag(?:s|en?)?": PH
  please use off for ko:
    ruhetage?: off
  please use ok for workday:
    on work days?: Mo-Fr
    weekdays?: Mo-Fr
    # https://www.gesetze-im-internet.de/burlg/__3.html
    werktags?: Mo-Sa
  omit ko:
    "öffnungszeit(?:en)?:?": ""
  omit tag key:
    'opening_hours\s*=': ""
  assuming open end for ko:
    "(?:bis|till?|-|–)? ?(?:open ?end|late)": +
  please use ok for missing data:
    '\?': ""
  please use ok for ko:
    till?: "-"
    "(?:public )?holidays?": PH
    "(?:one )?day after public holiday": "PH +1 day"
    "(?:one )?day before public holiday": PH -1 day
    school ?holidays?: SH
    weekends?: "Sa,Su"
    "on(?:_| )?appointments?": '"on appointment"'
    "by(?:_| )?appointments?": '"by appointment"'
    "nach(?: |_)vereinbarung": '"Nach Vereinbarung"'
    "nach(?: |_)absprache": '"Nach Absprache"'
    "sur(?: |_)rendez(?: |_|-)?vous": '"Sur rendez-vous"'
    "sur(?: |_)rdv": '"Sur rendez-vous"'
    "(?:schul)?ferien": SH
    "(?:an|nur)? ?sonn-?(?: und |/)feiertag(?:s|en?)?": "PH,Su"
  please use English abbreviation ok for ko:
    sundays?: Su
    mondays?: Mo
    # Source used for this abbreviation: https://westerhambeauty.co.uk/contact
    tues?: Tu
    tuesdays?: Tu
    weds?: We
    wednesdays?: We
    thurs?: Th
    thursdays?: Th
    fridays?: Fr
    saturdays?: Sa
    # German
    sonntags?: Su
    montags?: Mo
    die?: Tu
    dienstags?: Tu
    mit?: We
    mittwochs?: We
    don?: Th
    donnerstags?: Th
    freitags?: Fr
    samstags?: Sa
    # French
    lun?: Mo
    jeu?: Th
    ven?: Fr
    # Dutch
    zon?: Su
    woe?: We
    vri?: Fr
    zat?: Sa
    # Italian weekdays
    domenica?: Su
    domeniche?: Su
    lunedì?: Mo
    # Source used for this abbreviation: https://westerhambeauty.co.uk/contact
    mar?: Tu
    martedì?: Tu
    mer?: We
    mercoledì?: We
    giovedì?: Th
    venerdì?: Fr
    sabato?: Sa
    # Month names
    june?: Jun
    july?: Jul
    # German
    märz?: Mar
    # Italian
    giugno?: Jun
    luglio?: Jul
