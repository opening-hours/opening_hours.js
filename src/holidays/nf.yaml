# @attrib https://github.com/commenthol/date-holidays/blob/master/data/countries/NF.yaml

PH:
  - {'name': 'New Year''s Day', 'fixed_date': [1, 1], 'substitute_rule': 'if saturday,sunday then next monday'}
  - {'name': 'Australia Day', 'fixed_date': [1, 26], 'shift_rule': 'if saturday,sunday then next monday'}
  - {'name': 'Foundation Day', 'fixed_date': [3, 6], 'substitute_rule': 'if saturday,sunday then next monday'}
  - {'name': 'Good Friday', 'variable_date': easter, 'offset': -2}
  - {'name': 'Easter Monday', 'variable_date': easter, 'offset': 1}
  - {'name': 'Anzac Day', 'fixed_date': [4, 25]}
  - {'name': 'Anniversary (Bounty) Day', 'fixed_date': [6, 8], 'shift_rule': 'if saturday,sunday then next monday'}
  - {'name': 'Norfolk Island Agricultural Show', 'variable_date': firstOctoberMonday, 'offset': 7}
  - {'name': 'Thanksgiving Day', 'variable_date': lastNovemberWednesday}
  - {'name': 'Christmas Day', 'fixed_date': [12, 25], 'substitute_rule': 'if saturday then next monday if sunday then next tuesday'}
  - {'name': 'Boxing Day', 'fixed_date': [12, 26], 'substitute_rule': 'if saturday then next monday if sunday then next tuesday'}
